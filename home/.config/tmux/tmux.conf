# Purple Ops tmux workspace

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:clipboard:hyperlinks:extkeys"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g focus-events on
set -g set-clipboard on

# Session behavior
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind C-b send-prefix -2
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g repeat-time 500
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g set-titles on
set -g set-titles-string "ops · #S:#I · #W"
setw -g mode-keys vi

# Reload and session navigation
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux config reloaded"
bind s choose-tree -Zs
bind w choose-tree -Zw
bind Tab last-window

# Panes inherit the current working directory
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind x kill-pane
bind X kill-window

# Seamless nvim <-> tmux pane navigation (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Terminal-native workbench
bind y new-window -c "#{pane_current_path}" -n files "yazi"
bind C-y new-window -c "#{pane_current_path}" -n files "yazi"
bind g new-window -c "#{pane_current_path}" -n git "$HOME/.local/bin/tmux-lazygit"
bind C-g new-window -c "#{pane_current_path}" -n git "$HOME/.local/bin/tmux-lazygit"
bind m new-window -c "#{pane_current_path}" -n monitor "btop"
bind C-m new-window -c "#{pane_current_path}" -n monitor "btop"
bind f new-window -c "#{pane_current_path}" -n find "$HOME/.local/bin/tmux-fuzzy-open"
bind C-f new-window -c "#{pane_current_path}" -n find "$HOME/.local/bin/tmux-fuzzy-open"
bind e run-shell "$HOME/.local/bin/tmux-explorer-toggle '#{pane_id}'"
bind C-e run-shell "$HOME/.local/bin/tmux-explorer-toggle '#{pane_id}'"
bind ? display-popup -E -w 76% -h 80% "glow -p '$HOME/.config/tmux/OPS.md'"

# Vi-style copy mode with Wayland clipboard integration
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-and-cancel "wl-copy"
# Ensure mouse drag also works in emacs copy-mode (fallback)
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode y send -X copy-pipe-and-cancel "wl-copy"

# Visual system
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-left-length 36
set -g status-right-length 90
set -g status-style "bg=#0b0812,fg=#b5a8d5"
set -g status-left "#[fg=#0b0812,bg=#a277ff,bold] 󰆍 #S #[fg=#a277ff,bg=#0b0812]"
set -g status-right "#{?client_prefix,#[fg=#0b0812#,bg=#ffd580#,bold] PREFIX #[fg=#61e2ff#,bg=#0b0812],#[fg=#61e2ff#,bg=#0b0812]} #[fg=#5f5875]󰉋 #[fg=#c099ff]#{b:pane_current_path} "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#8b80a7,bg=#0b0812] #I:#W "
setw -g window-status-current-format "#[fg=#0b0812,bg=#c099ff,bold] #I:#W#{?window_zoomed_flag, 󰊓,} #[fg=#c099ff,bg=#0b0812]"
setw -g window-status-activity-style "fg=#61e2ff,bg=#0b0812,bold"
setw -g window-status-bell-style "fg=#0b0812,bg=#ff5c8a,bold"

set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-style "fg=#2d2442"
set -g pane-active-border-style "fg=#a277ff"

set -g mode-style "fg=#0b0812,bg=#a277ff,bold"
set -g message-style "fg=#0b0812,bg=#c099ff,bold"
set -g message-command-style "fg=#e8e3f3,bg=#251a3d"
set -g popup-style "fg=#e8e3f3,bg=#0b0812"
set -g popup-border-style "fg=#a277ff,bg=#0b0812"
set -g popup-border-lines rounded
set -g clock-mode-colour "#c099ff"
set -g clock-mode-style 24

