[mgr]
prepend_keymap = [
  { on = "<Enter>",      run = "plugin smart-enter", desc = "Enter folders or open files" },
  { on = [ "g", "d" ], run = "cd ~/Downloads",  desc = "Go to Downloads" },
  { on = [ "g", "t" ], run = "cd ~/tools",      desc = "Go to tools" },
  { on = [ "g", "l" ], run = "cd ~/loophunter", desc = "Go to loophunter" },
  { on = [ "g", "u" ], run = "cd ~/university", desc = "Go to university" },
]
