# ── Typography ────────────────────────────────────────────────────────────────
font_family      JetBrainsMonoNL Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5
adjust_line_height  5%
adjust_column_width 0

# ── Cursor and interaction ───────────────────────────────────────────────────
cursor                  #c099ff
cursor_text_color        #0b0812
cursor_shape             beam
cursor_beam_thickness    1.5
cursor_blink_interval    0.55
cursor_stop_blinking_after 15
cursor_trail             3
cursor_trail_decay       0.08 0.18
cursor_trail_start_threshold 2
mouse_hide_wait          2.0
detect_urls              yes
url_color                #61e2ff
url_style                curly
show_hyperlink_targets   yes

# ── Window ───────────────────────────────────────────────────────────────────
background_opacity       0.94
dynamic_background_opacity yes
window_padding_width     10 12
placement_strategy       center
remember_window_size     yes
initial_window_width     1120
initial_window_height    720
confirm_os_window_close  0
enable_audio_bell        no
window_alert_on_bell     yes
wayland_titlebar_color   background
hide_window_decorations  yes

# tmux owns the workspace; Kitty stays a focused rendering layer.
enabled_layouts          stack
window_border_width      1.5pt
draw_minimal_borders     yes
window_margin_width      0
single_window_margin_width 0
active_border_color      #a277ff
inactive_border_color    #2d2442
bell_border_color        #ff5c8a
inactive_text_alpha      0.90

# ── Tabs ─────────────────────────────────────────────────────────────────────
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_align            left
tab_bar_min_tabs         2
tab_bar_margin_width     10
tab_bar_margin_height    8 0
active_tab_font_style    bold
inactive_tab_font_style  normal
tab_activity_symbol      ●
tab_title_max_length     28
tab_switch_strategy      previous
tab_title_template       "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}  {title}"

# ── Scrollback ───────────────────────────────────────────────────────────────
scrollback_lines         20000
scrollback_pager_history_size 32
scrollback_fill_enlarged_window yes
wheel_scroll_multiplier  3.0
touch_scroll_multiplier  1.0
strip_trailing_spaces    smart

# ── Shell power features and safe defaults ──────────────────────────────────
shell                    __HOME__/.local/bin/kitty-workspace
shell_integration        disabled
paste_actions            confirm
clipboard_control        write-clipboard write-primary read-clipboard-ask read-primary-ask
allow_remote_control     no

# ── Purple Ops palette: focus, navigation, attention, failure ────────────────
background               #0b0812
foreground               #e8e3f3
selection_background     #372553
selection_foreground     #f7f3ff

tab_bar_background       #0b0812
active_tab_background    #6d28d9
active_tab_foreground    #f7f3ff
inactive_tab_background  #171126
inactive_tab_foreground  #8b80a7

color0  #171126
color1  #ff5c8a
color2  #6ee7b7
color3  #ffd580
color4  #7aa2f7
color5  #a277ff
color6  #61e2ff
color7  #c8c1d9
color8  #5f5875
color9  #ff8daf
color10 #9cf0ce
color11 #ffe4a6
color12 #a7c2ff
color13 #c099ff
color14 #93ecff
color15 #f7f3ff

# Send a plain NUL for tmux's Ctrl+Space prefix, including in Kitty's
# extended-keyboard mode.
map ctrl+space            send_text all \x00
# Preserve Shift+Enter through Kitty → tmux → ble.sh. Without an explicit
# CSI-u sequence, this keyboard reports it as an ordinary Enter.
map shift+enter           send_text all \x1b[13;2u
map ctrl+shift+0          change_font_size all 0
